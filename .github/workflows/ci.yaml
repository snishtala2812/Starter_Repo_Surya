name: CI

on: # trigger
  workflow_dispatch: # manual button to run this workflow

  push:
    branches:
      - main
    paths:
      - 'src/*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run tests
        run:  echo "Tests passed"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7


      - name: Run tests 2
        run:  echo "Lint passed"

  build:
    needs: 
     - test
     - lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build application
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html

          
  deploy-demo:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Inspect files
        run: ls -R .
        
      - name: Deploy
        run: echo "Deploying application"
